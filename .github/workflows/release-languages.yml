name: Release Languages and Update Showcase

on:
  pull_request:
    types:
      - closed
    branches:
      - master
    paths:
      - 'languages/**'
  workflow_dispatch: # Adds a manual start button
    inputs:
      debug_langs:
        description: 'Languages for forced manual debugging (separated by a space, for example: fr-FR it-IT)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    # Run if PR is merged OR if it is a manual run
    if: ${{ github.event.pull_request.merged == true || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get current date for version
        id: versioning
        run: echo "VERSION=$(date +'%Y.%m.%d.%H%M')" >> $GITHUB_OUTPUT

      - name: Detect changed languages
        id: detect_changes
        run: |
          # If the run is manual and input is passed, we use it. Otherwise, we search for it using git diff.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.debug_langs }}" ]; then
            GIT_CHANGED_LANGS="${{ github.event.inputs.debug_langs }}"
          else
            GIT_CHANGED_LANGS=$(git diff --name-only HEAD^ HEAD | grep '^languages/' | cut -d'/' -f2 | sort -u || true)
          fi

          CLEANED_LANGS=""

          # Check every changed language
          for lang in $GIT_CHANGED_LANGS; do
            # Exclude English
            if [ "$lang" = "en-GB" ]; then
              continue
            fi

            echo "Checking git changes for $lang..."

            # Check what exactly has changed inside the files of this language.
            # We look at the diff (difference) of the lines that were ADDED (starting with +)
            # and trim off comment lines (;), empty lines, and Git metadata.
            REAL_CHANGES=$(git diff HEAD^ HEAD -- "languages/$lang/" | grep '^[+][^+]' | grep -v '^[+][[:space:]]*;' | grep -v '^[+][[:space:]]*$' || true)

            if [ -n "$REAL_CHANGES" ]; then
              echo "=> Language $lang has REAL translation changes. Adding to build queue."
              CLEANED_LANGS="$CLEANED_LANGS $lang"
            else
              echo "=> Language $lang changed in Git, but has NO new translation lines (only comments, metadata, or spacing updated). Skipping."
            fi
          done

          # Trim leading/trailing spaces
          CLEANED_LANGS=$(echo $CLEANED_LANGS | xargs)

          echo "Final languages list to build and release: $CLEANED_LANGS"
          echo "langs=$CLEANED_LANGS" >> $GITHUB_OUTPUT

      - name: Process, Zip and Calculate SHA
        if: steps.detect_changes.outputs.langs != ''
        run: |
          VERSION="${{ steps.versioning.outputs.VERSION }}"
          
          # Create a clean file to store hashes
          > sha_list.txt
          
          for lang in ${{ steps.detect_changes.outputs.langs }}; do
            echo "Processing $lang..."
          
            ZIP_NAME="pkg_quiztools_${lang}_${VERSION}.zip"
            MANIFEST="pkg_quiztools_$lang.xml"
          
            cd languages/$lang
          
            # Delete files that do not contain useful translation (only comments and emptiness)
            echo "Checking for pseudo-empty .ini files (only comments)..."
            for ini_file in admin/*.ini site/*.ini; do
              # Check if the file exists (in case the mask is empty)
              if [ -f "$ini_file" ]; then
                # Counting the number of lines that do NOT start with ';'
                REAL_LINES_COUNT=$(grep -v '^[[:space:]]*;' "$ini_file" | grep -v '^[[:space:]]*$' | wc -l)
          
                if [ "$REAL_LINES_COUNT" -eq 0 ]; then
                  echo "File $ini_file contains only comments or empty lines. Deleting."
                  rm "$ini_file"
                fi
              fi
            done
          
            # Validate ini-files inside <fileset> tags using xmlstarlet
            echo "Validating fileset manifests in $MANIFEST..."
          
            # Let's insert the correct target language tag into the target attributes.
            # sed -i "s|language/en-GB|language/$lang|g" "$MANIFEST"
          
            # Find all <filename> elements inside <files>
            FILE_LIST=$(xmlstarlet sel -t -m "//fileset/files/filename" -v "../@folder" -o ":" -v "." -n "$MANIFEST")
          
            echo "$FILE_LIST" | while IFS=: read -r folder filename; do
              if [ -z "$filename" ]; then continue; fi
          
              REAL_PATH="$folder/$filename"
          
              # If the file is not physically on the disk, remove that specific <filename> tag from the XML
              if [ ! -f "$REAL_PATH" ]; then
                echo "WARNING: File $REAL_PATH not found! Removing from XML."
                xmlstarlet ed -L -d "//fileset/files[@folder='$folder']/filename[text()='$filename']" "$MANIFEST"
              fi
            done
          
            # Clean empty <files> blocks if all files have been deleted from them
            xmlstarlet ed -L -d "//fileset/files[not(filename)]" "$MANIFEST"
          
            # Apply the version and current date
            sed -i "s|<version>.*</version>|<version>$VERSION</version>|g" "$MANIFEST"
            sed -i "s|<creationDate>.*</creationDate>|<creationDate>$(date +'%Y-%m-%d')</creationDate>|g" "$MANIFEST"
          
            # Package compression (we archive only those folders that physically exist)
            ZIP_PATHS="$MANIFEST"
            [ -d "admin" ] && ZIP_PATHS="$ZIP_PATHS admin"
            [ -d "site" ] && ZIP_PATHS="$ZIP_PATHS site"
          
            zip -r ../../$ZIP_NAME $ZIP_PATHS
            cd ../..
          
            # Writing a hash to a local file
            SHA256_HASH=$(sha256sum "$ZIP_NAME" | awk '{print $1}')
            echo "${lang}:${SHA256_HASH}" >> sha_list.txt

            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/$lang-$VERSION/$ZIP_NAME"
          
            sed -i -E "s|(id=\"ver-$lang\">)[^<]*|\1$VERSION|g" index.html
            sed -i -E "s|(id=\"link-$lang\" href=\")[^\"]*|\1$DOWNLOAD_URL|g" index.html
          done

      - name: Commit Showcase (index.html)
        if: steps.detect_changes.outputs.langs != ''
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update showcase page for updated languages [skip ci]" || echo "No changes"
          git push

      - name: Create GitHub Releases
        if: steps.detect_changes.outputs.langs != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.versioning.outputs.VERSION }}"
          for lang in ${{ steps.detect_changes.outputs.langs }}; do
            TAG="$lang-$VERSION"
            ZIP_NAME="pkg_quiztools_${lang}_${VERSION}.zip"
            gh release create "$TAG" "$ZIP_NAME" --title "$lang v$VERSION" --notes "Release for $lang"
          done

      - name: Trigger Update Server Repository
        if: steps.detect_changes.outputs.langs != ''
        run: |
          VERSION="${{ steps.versioning.outputs.VERSION }}"
          
          for lang in ${{ steps.detect_changes.outputs.langs }}; do
            ZIP_NAME="pkg_quiztools_${lang}_${VERSION}.zip"
            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/$lang-$VERSION/$ZIP_NAME"
          
            # Reading SHA from a text file using Bash
            CURRENT_SHA=$(grep "^${lang}:" sha_list.txt | cut -d':' -f2)
          
            echo "Sending $lang with SHA $CURRENT_SHA to second repo..."
          
            # Sending a webhook 
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.UPDATES_REPO_TOKEN }}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository_owner }}/updateservers/dispatches \
              -d "{\"event_type\": \"quiztools_language_updated\", \"client_payload\": {\"lang\": \"$lang\", \"version\": \"$VERSION\", \"url\": \"$DOWNLOAD_URL\", \"sha256\": \"$CURRENT_SHA\"}}"
          done
