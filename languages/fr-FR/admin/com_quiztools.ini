; Certificate form:
COM_QUIZTOOLS_CERTIFICATE_FIELD_NOTE_DESC="Vous pouvez utiliser les codes suivants : #nom# et #prénom# pour afficher le nom et le prénom de l'utilisateur, #cours# pour afficher le nom du quiz, #points# pour afficher le score obtenu par l'utilisateur, #pourcentage# pour afficher le pourcentage de points obtenus par rapport au maximum autorisé, #date# pour afficher la date actuelle.<br>Vous pouvez également utiliser des formats de date, par exemple : #date(Y-m-d)# affiche 2025-01-01 ; #date(d F Y)# affiche 01 janvier 2025. Consultez <a href=\"https://www.php.net/manual/en/datetime.format.php\" target=\"_blank\" rel=\"nofollow noopener\"><span style=\"background:#fff;\">les formats de date</span></a> pour plus de détails.<br>Les informations nécessaires (nom, prénom, etc.) pour les invités seront prises à partir des données saisies avant de passer un quiz, à condition que ces champs soient définis dans la section de description du quiz.<br><br>Vous pouvez ajouter la police nécessaire (fichier .ttf) dans le dossier /media/com_quiztools/fonts/."
